<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Skylark BI Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 32px auto;
    padding: 0 16px;
    background: #f5f6f8;
    color: #1a1a1a;
  }
  h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }

  #log {
    background: #fff;
    border: 1px solid #e2e4e8;
    border-radius: 10px;
    padding: 16px;
    height: 480px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .row { display: flex; margin-bottom: 14px; }
  .row.u { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    font-size: 14.5px;
  }
  .row.u .bubble { background: #2f6feb; color: #fff; border-bottom-right-radius: 4px; }
  .row.a .bubble { background: #eef0f3; color: #1a1a1a; border-bottom-left-radius: 4px; }
  .row.a .bubble.error { background: #fde8e8; color: #a12626; }
  .row.a .bubble.pending { color: #888; font-style: italic; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble li { margin-bottom: 4px; }
  .bubble strong { color: #14305c; }

  .inputbar { display: flex; gap: 8px; }
  #msg {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid #d7d9dd;
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }
  #msg:focus { border-color: #2f6feb; }
  button {
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    background: #2f6feb;
    color: #fff;
    font-size: 14.5px;
    cursor: pointer;
  }
  button:disabled { background: #a9bfe8; cursor: default; }
  button:hover:not(:disabled) { background: #2559c9; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    font-size: 12.5px;
    background: #fff;
    border: 1px solid #d7d9dd;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    color: #444;
  }
  .chip:hover { border-color: #2f6feb; color: #2f6feb; }
</style>
</head>
<body>
<h2>Skylark Drones — BI Agent</h2>
<div class="subtitle">Ask about pipeline, revenue, sectors, or execution status — pulled live from Monday.com.</div>

<div class="suggestions">
  <div class="chip" onclick="ask(this)">How's our pipeline looking for the mining sector?</div>
  <div class="chip" onclick="ask(this)">What's our total receivable amount?</div>
  <div class="chip" onclick="ask(this)">Give me a leadership update</div>
</div>

<div id="log"></div>
<div class="inputbar">
  <input id="msg" placeholder="Ask a question…" />
  <button id="sendBtn" onclick="send()">Ask</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
  const API_BASE = ""; // same-origin: frontend is served by the backend itself
  const log = document.getElementById("log");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("sendBtn");

  function addRow(role, text, cls) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (cls ? " " + cls : "");
    bubble.textContent = text;
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function renderMarkdown(bubble, text) {
    bubble.innerHTML = marked.parse(text);
  }

  function ask(el) {
    input.value = el.textContent;
    send();
  }

  async function send() {
    const message = input.value.trim();
    if (!message) return;
    addRow("u", message);
    input.value = "";
    sendBtn.disabled = true;
    const pending = addRow("a", "Thinking…", "pending");

    try {
      const resp = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: "web", message }),
      });
      const raw = await resp.text();
      let data;
      try { data = JSON.parse(raw); } catch { data = null; }

      if (!resp.ok || !data) {
        pending.textContent = `Had trouble getting a response (HTTP ${resp.status}). This is usually a brief network hiccup — try asking again.`;
        pending.classList.add("error");
      } else {
        pending.classList.remove("pending");
        renderMarkdown(pending, data.answer);
      }
    } catch (e) {
      pending.classList.remove("pending");
      pending.classList.add("error");
      pending.textContent = "Couldn't reach the backend: " + e;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
