<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Skylark BI Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; }
  #log { border: 1px solid #ccc; padding: 12px; height: 420px; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; }
  .u { color: #1a5; font-weight: bold; }
  .a { color: #333; }
  input { width: 78%; padding: 8px; }
  button { padding: 8px 14px; }
</style>
</head>
<body>
<h2>Skylark Drones — BI Agent (prototype)</h2>
<div id="log"></div>
<input id="msg" placeholder="e.g. How's our pipeline looking for energy sector this quarter?" />
<button onclick="send()">Ask</button>

<script>
  const API_BASE = "http://localhost:8000"; // change to your deployed backend URL
  const log = document.getElementById("log");
  const input = document.getElementById("msg");

  function append(role, text) {
    const div = document.createElement("div");
    div.className = role;
    div.textContent = (role === "u" ? "You: " : "Agent: ") + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function send() {
    const message = input.value.trim();
    if (!message) return;
    append("u", message);
    input.value = "";
    append("a", "…thinking…");
    try {
      const resp = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: "web", message }),
      });
      const data = await resp.json();
      log.lastChild.textContent = "Agent: " + data.answer;
    } catch (e) {
      log.lastChild.textContent = "Agent: (error contacting backend: " + e + ")";
    }
  }

  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
